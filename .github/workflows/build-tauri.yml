name: Build UEC for NixOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25

      - name: Build NixOS package
        # npm and cargo downloads happen during the build, so allow networking.
        run: nix --extra-experimental-features 'nix-command flakes' build .#uec --option sandbox false --show-trace

      - name: Archive build result
        run: tar -czf uec-nixos.tar.gz -C result .

      - name: Upload NixOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: uec-nixos
          path: uec-nixos.tar.gz
